<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>رصد ملاحظات المحاضرات — وكالة الجامعة للشؤون الأكاديمية</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
:root{
  --dark-green:#1A5632; --light-green:#2D8A4E; --deep-green:#143F28;
  --gold:#B87B02; --gold-light:#F0D878; --gold-bg:#FFF9E8;
  --bg:#F4F7F5; --card:#FFFFFF; --border:#D8E9DD; --border-strong:#A8D5BA;
  --text:#1F2A24; --muted:#6B7C72;
  --red:#D03A3A; --red-bg:#FEECEC; --ok:#2E8B57; --ok-bg:#E8F5E9;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);font-family:'Cairo',system-ui,-apple-system,sans-serif;color:var(--text);font-size:15px;padding-bottom:90px}
header{background:linear-gradient(135deg,var(--dark-green),var(--deep-green));color:#fff;padding:18px 16px;text-align:center}
header h1{margin:0;font-size:18px;font-weight:700}
header p{margin:4px 0 0;font-size:12px;opacity:.85}
.wrap{max-width:640px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:14px}
.card h2{margin:0 0 12px;font-size:15px;color:var(--dark-green);display:flex;align-items:center;gap:8px}
.card h2::before{content:'';width:4px;height:16px;background:var(--gold);border-radius:2px}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:15px;font-family:inherit;font-size:16px;font-weight:700;cursor:pointer}
.btn-scan{background:var(--dark-green);color:#fff}
.btn-scan:active{background:var(--light-green)}
.btn-send{background:var(--gold);color:#fff}
.btn-send:disabled{background:#C9D3CD;color:#fff}
#reader{margin-top:12px;border-radius:12px;overflow:hidden;display:none}
#reader.on{display:block}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.f{background:#FAFCFB;border:1px solid var(--border);border-radius:10px;padding:9px 11px;min-height:56px}
.f.full{grid-column:1 / -1}
.f label{display:block;font-size:11px;color:var(--muted);margin-bottom:3px}
.f .v{font-size:15px;font-weight:600;line-height:1.45;word-break:break-word}
.f .v.empty{color:#B4C0B9;font-weight:400}
.f.key{background:var(--gold-bg);border-color:var(--gold-light)}
.note-bar{padding:11px 13px;border-radius:10px;font-size:13.5px;line-height:1.6;margin-bottom:12px;display:none}
.note-bar.on{display:block}
.note-bar.warn{background:var(--red-bg);color:#9B2020;border:1px solid #F3C9C9}
.note-bar.ok{background:var(--ok-bg);color:#1B5E37;border:1px solid #A8E6CF}
.note-bar.info{background:#EEF4F1;color:var(--muted);border:1px solid var(--border)}
.chk{display:flex;align-items:center;gap:11px;padding:12px 11px;border:1.5px solid var(--border);border-radius:10px;margin-bottom:8px;cursor:pointer;user-select:none}
.chk input{width:21px;height:21px;accent-color:var(--dark-green);flex:none;margin:0}
.chk.sel{background:var(--gold-bg);border-color:var(--gold)}
.chk span{font-size:14.5px}
textarea{width:100%;min-height:78px;padding:11px;border:1.5px solid var(--border-strong);border-radius:10px;font-family:inherit;font-size:15px;resize:vertical}
.sendbar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--border);padding:11px 14px;box-shadow:0 -3px 14px rgba(0,0,0,.07)}
.sendbar .inner{max-width:640px;margin:0 auto}
.hidden{display:none !important}
.multi{font-size:12px;color:var(--gold);margin-top:8px;display:none}
.multi.on{display:block}
</style>
</head>
<body>

<header>
  <h1>رصد ملاحظات المحاضرات</h1>
  <p>وكالة الجامعة للشؤون الأكاديمية · وحدة ضمان الجودة التعليمية</p>
</header>

<div class="wrap">

  <div class="card">
    <h2>تحديد القاعة</h2>
    <button type="button" class="btn btn-scan" id="btnScan">مسح باركود اللوحة</button>
    <div id="reader"></div>
    <div class="note-bar" id="scanMsg"></div>
    <div id="diag" style="display:none;margin-top:10px;padding:10px;background:#F7F9F8;border:1px solid var(--border);border-radius:10px">
      <div style="font-size:11px;color:var(--muted);margin-bottom:4px">نصّ الباركود المقروء (انسخه وأرسله):</div>
      <div id="diagScan" style="font-size:12.5px;direction:ltr;text-align:left;word-break:break-all;background:#fff;border:1px solid var(--border);border-radius:7px;padding:8px;user-select:all;-webkit-user-select:all"></div>
      <div style="font-size:11px;color:var(--muted);margin:8px 0 4px">ردّ خدمة القراءة:</div>
      <div id="diagResp" style="font-size:11.5px;direction:ltr;text-align:left;word-break:break-all;background:#fff;border:1px solid var(--border);border-radius:7px;padding:8px;max-height:130px;overflow:auto;user-select:all;-webkit-user-select:all"></div>
    </div>
  </div>

  <div class="card">
    <h2>بيانات القاعة والزمن</h2>
    <div class="grid">
      <div class="f key"><label>رقم القاعة</label><div class="v empty" id="fRoom">—</div></div>
      <div class="f key"><label>المبنى</label><div class="v empty" id="fBuilding">—</div></div>
      <div class="f"><label>المقر</label><div class="v empty" id="fCampus">—</div></div>
      <div class="f"><label>نوع القاعة</label><div class="v empty" id="fRoomType">—</div></div>
      <div class="f"><label>سعة القاعة</label><div class="v empty" id="fCapacity">—</div></div>
      <div class="f"><label>اليوم</label><div class="v" id="fDay">—</div></div>
      <div class="f"><label>التاريخ</label><div class="v" id="fDate">—</div></div>
      <div class="f"><label>الوقت</label><div class="v" id="fTime">—</div></div>
      <div class="f"><label>الفترة الحالية</label><div class="v" id="fPeriod">—</div></div>
    </div>
  </div>

  <div class="card">
    <h2>المحاضرة الجارية الآن</h2>
    <div class="note-bar" id="lecMsg"></div>
    <div class="grid" id="lecGrid">
      <div class="f full"><label>المقرر</label><div class="v empty" id="fCourse">—</div></div>
      <div class="f"><label>كود المقرر</label><div class="v empty" id="fCode">—</div></div>
      <div class="f"><label>الشعبة</label><div class="v empty" id="fSec">—</div></div>
      <div class="f full"><label>المحاضر</label><div class="v empty" id="fTeacher">—</div></div>
      <div class="f"><label>النشاط</label><div class="v empty" id="fAct">—</div></div>
      <div class="f"><label>عدد الطلبة</label><div class="v empty" id="fStu">—</div></div>
      <div class="f"><label>القسم</label><div class="v empty" id="fDept">—</div></div>
      <div class="f"><label>الكلية</label><div class="v empty" id="fCol">—</div></div>
      <div class="f full"><label>فترات المحاضرة</label><div class="v empty" id="fSlots">—</div></div>
    </div>
    <div class="multi" id="fMulti"></div>
  </div>

  <div class="card">
    <h2>الملاحظات</h2>
    <div id="notesBox"></div>
    <label style="font-size:11px;color:var(--muted);display:block;margin:14px 0 4px">ملاحظة حرة (اختيارية)</label>
    <textarea id="freeNote" placeholder="اكتب ملاحظتك هنا…"></textarea>
  </div>

</div>

<div style="text-align:center;font-size:11px;color:var(--muted);padding:0 0 8px" id="verTag"></div>

<div class="sendbar">
  <div class="inner">
    <button type="button" class="btn btn-send" id="btnSend" disabled>إرسال</button>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function () {
  'use strict';

  /* ═════════ إعدادات قابلة للتعديل ═════════ */

  var APP_VERSION = 'v1.4';        // يظهر أسفل الشاشة ليتأكد المستخدم أنه على أحدث نسخة

  // نقطة الإرسال (Cloudflare Worker وسيط -> Apps Script)
  var SUBMIT_URL   = 'https://leadership-visits.eqaunit.workers.dev';
  // Worker قراءة صفحة القاعة من موقع الجامعة (يُستدعى فقط إذا لم يحمل الباركود رمز القاعة)
  var ROOMSCAN_URL = 'https://room-scan.eqaunit.workers.dev';
  // ملف الجدول الدراسي المحلي
  var SCHEDULE_URL = 'schedule_data_summer.json';

  // ★ خريطة أوقات الفترات — الفترة ٥٠ دقيقة، تبدأ رأس الساعة من الثامنة.
  // شطر الطلاب: بريك 12:00–13:00 وبريك 15:00–16:00، والترقيم يقفز فوقهما (إزاحة ساعة عند كل بريك).
  // شطر الطالبات: متصل بلا بريك.
  var GRID_M = [                                   // طلاب
    null,
    ['08:00','08:50'], ['09:00','09:50'], ['10:00','10:50'], ['11:00','11:50'],
    /* بريك 12:00–13:00 */
    ['13:00','13:50'], ['14:00','14:50'],
    /* بريك 15:00–16:00 */
    ['16:00','16:50'], ['17:00','17:50'], ['18:00','18:50'], ['19:00','19:50'],
    ['20:00','20:50'], ['21:00','21:50']
  ];
  var GRID_F = [                                   // طالبات
    null,
    ['08:00','08:50'], ['09:00','09:50'], ['10:00','10:50'], ['11:00','11:50'],
    ['12:00','12:50'], ['13:00','13:50'], ['14:00','14:50'], ['15:00','15:50'],
    ['16:00','16:50'], ['17:00','17:50'], ['18:00','18:50'], ['19:00','19:50']
  ];
  function gridFor(campus) {
    return (campus && campus.indexOf('طالبات') !== -1) ? GRID_F : GRID_M;
  }

  // مهلة سماح بالدقائق قبل بداية الفترة وبعد نهايتها (لالتقاط الزيارات على الحواف)
  var GRACE_MIN = 10;

  var NOTE_OPTIONS = [
    'عدم وجود محاضر',
    'عدم وجود طلاب',
    'المحاضر مختلف عن المسجَّل بالجدول',
    'القاعة مغلقة',
    'لا توجد محاضرة رغم جدولتها',
    'محاضرة قائمة غير مسجَّلة بالجدول',
    'القاعة غير مهيأة (تكييف/إضاءة/مقاعد)',
    'خلل في التجهيزات التقنية'
  ];

  var DAY_NAMES = ['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];

  /* ═════════ حالة ═════════ */

  var SCHED = null;          // ملف الجدول
  var room  = null;          // { key, label, code, building, campus, type, raw }
  var lecture = null;        // المحاضرة المطابِقة
  var allMatches = [];
  var scanner = null, scanning = false;

  var $ = function (id) { return document.getElementById(id); };

  function setV(id, val) {
    var el = $(id);
    if (val === null || val === undefined || val === '') {
      el.textContent = '—'; el.className = 'v empty';
    } else {
      el.textContent = val; el.className = 'v';
    }
  }

  function msg(id, text, kind) {
    var el = $(id);
    if (!text) { el.className = 'note-bar'; el.textContent = ''; return; }
    el.className = 'note-bar on ' + (kind || 'info');
    el.textContent = text;
  }

  /** fetch بمهلة: يفشل برسالة واضحة بدل التعليق إلى الأبد. */
  function fetchT(url, opts, ms) {
    ms = ms || 15000;
    opts = opts || {};
    var ctl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
    if (ctl) opts.signal = ctl.signal;
    var timedOut = false;
    var to = setTimeout(function () { timedOut = true; if (ctl) ctl.abort(); }, ms);
    return fetch(url, opts).then(
      function (r) { clearTimeout(to); return r; },
      function (e) {
        clearTimeout(to);
        throw new Error(timedOut ? ('انتهت المهلة بعد ' + (ms / 1000) + ' ثانية بلا ردّ') : e.message);
      }
    );
  }

  /* ═════════ الزمن ═════════ */

  // وضع محاكاة للاختبار خارج أوقات الدوام:  ?sim=2026-07-30T09:47
  var SIM = (function () {
    var m = location.search.match(/[?&]sim=([^&]+)/);
    if (!m) return null;
    var d = new Date(decodeURIComponent(m[1]).replace(' ', 'T'));
    return isNaN(d.getTime()) ? null : d;
  })();

  function nowKSA() {
    if (SIM) return SIM;
    // تثبيت المنطقة الزمنية على توقيت السعودية مهما كان ضبط الجهاز
    var s = new Date().toLocaleString('en-US', { timeZone: 'Asia/Riyadh' });
    return new Date(s);
  }

  function pad(n) { return (n < 10 ? '0' : '') + n; }

  function toMin(hhmm) {
    var p = hhmm.split(':');
    return parseInt(p[0], 10) * 60 + parseInt(p[1], 10);
  }

  function currentPeriod(d, grid) {
    var m = d.getHours() * 60 + d.getMinutes();
    for (var i = 1; i < grid.length; i++) {
      if (!grid[i]) continue;
      if (m >= toMin(grid[i][0]) - GRACE_MIN &&
          m <= toMin(grid[i][1]) + GRACE_MIN) return i;
    }
    return null;
  }

  function refreshClock() {
    var d = nowKSA();
    var dow = d.getDay();
    var p = currentPeriod(d, gridFor(room && room.campus));
    setV('fDay', DAY_NAMES[dow]);
    setV('fDate', d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()));
    setV('fTime', pad(d.getHours()) + ':' + pad(d.getMinutes()));
    setV('fPeriod', p ? ('الفترة ' + p) : (room ? 'بريك / خارج الفترات' : '—'));
    return { date: d, dow: dow, period: p };
  }

  /* ═════════ توحيد مفتاح القاعة (مطابق لمنطق بناء الملف) ═════════ */

  function normRoom(s) {
    if (!s) return null;
    s = String(s).trim();
    if (!s) return null;
    s = s.replace(/[٠-٩]/g, function (c) { return '٠١٢٣٤٥٦٧٨٩'.indexOf(c); });
    s = s.replace(/\u0640/g, '');
    s = s.replace(/[أإآٱ]/g, 'ا').replace(/ى/g, 'ي');
    s = s.replace(/\s+/g, ' ').trim();
    return s.toUpperCase();
  }

  // رمز القاعة الموحَّد: مبنى-دور.رقم  مثل 23-0.015
  var ROOM_CODE_RE = /\b(\d{1,2})\s*-\s*(\d)\.(\d{2,3})\b/;

  function extractRoomCode(text) {
    if (!text) return null;
    var m = String(text).match(ROOM_CODE_RE);
    return m ? (m[1] + '-' + m[2] + '.' + m[3]) : null;
  }

  /* ═════════ تحميل الجدول ═════════ */

  function loadSchedule() {
    return fetchT(SCHEDULE_URL, { cache: 'no-store' }, 25000)
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function (j) { SCHED = j; return j; });
  }

  /* ═════════ البحث عن المحاضرة ═════════ */

  function findLecture(roomKey) {
    allMatches = [];
    lecture = null;
    var t = refreshClock();

    if (!SCHED) { msg('lecMsg', 'لم يُحمَّل الجدول الدراسي بعد.', 'warn'); return; }

    var entries = SCHED.index[roomKey];
    if (!entries) {
      msg('lecMsg', 'القاعة غير مدرجة في الجدول الدراسي لهذا الفصل.', 'warn');
      clearLecture(); return;
    }
    if (t.dow > 4) {
      msg('lecMsg', 'اليوم ' + DAY_NAMES[t.dow] + ' — لا دراسة.', 'info');
      clearLecture(); return;
    }
    if (!t.period) {
      msg('lecMsg', 'الوقت الحالي بريك أو خارج فترات اليوم الدراسي.', 'info');
      clearLecture(); return;
    }

    // ★ المطابقة المحايدة: هل رقم الفترة الجارية ضمن فترات الصف؟
    // تعمل مع الثنائي والثلاثي والرباعي وأي تجميع آخر.
    // ورقم الفترة يُحسب بشبكة الشطر الذي يخصّ الصفّ نفسه (بريك الطلاب يزحزح ترقيمهم).
    for (var i = 0; i < entries.length; i++) {
      var e = entries[i];
      if (e.d !== t.dow) continue;
      var ep = currentPeriod(t.date, gridFor(e.cmp));
      if (ep && e.p.indexOf(ep) !== -1) allMatches.push(e);
    }

    if (!allMatches.length) {
      msg('lecMsg', 'لا توجد محاضرة مجدولة في هذه القاعة الآن (الفترة ' + t.period + ').', 'info');
      clearLecture(); return;
    }

    lecture = allMatches[0];
    msg('lecMsg', '', null);
    showLecture(lecture);

    if (allMatches.length > 1) {
      $('fMulti').className = 'multi on';
      $('fMulti').textContent = 'تنبيه: ' + allMatches.length + ' محاضرات مسجَّلة على القاعة في الفترة نفسها (تعارض جدولة). المعروض أولها.';
    } else {
      $('fMulti').className = 'multi';
    }
  }

  function showLecture(e) {
    setV('fCourse', e.cr); setV('fCode', e.cd); setV('fSec', e.sec);
    setV('fTeacher', e.tea); setV('fAct', e.act); setV('fStu', e.stu);
    setV('fDept', e.dep); setV('fCol', e.col);
    setV('fSlots', e.p.join('، '));
  }

  function clearLecture() {
    ['fCourse','fCode','fSec','fTeacher','fAct','fStu','fDept','fCol','fSlots']
      .forEach(function (id) { setV(id, null); });
    $('fMulti').className = 'multi';
  }

  /* ═════════ تثبيت القاعة ═════════ */

  function applyRoom(info) {
    var key = normRoom(info.code || info.label);
    room = {
      key: key,
      label: info.label || info.code || key,
      code: info.code || null,
      building: info.building || null,
      campus: info.campus || null,
      type: info.type || null,
      capacity: info.capacity || null,
      source: info.source || 'باركود'
    };

    // إثراء من الجدول: بيانات الجدول أوثق من نصّ الصفحة، فلها الأولوية
    if (SCHED && SCHED.rooms[key]) {
      var m = SCHED.rooms[key];
      if (m.cmp) room.campus = m.cmp;              // المقر من الجدول يُقدَّم دائماً
      room.code = m.code || room.code;
      room.label = m.label || room.label;
    }
    // رقم المبنى من بادئة الرمز الموحَّد
    if (!room.building) {
      var mm = (room.code || room.label || '').match(/^(\d{1,2})-/);
      if (mm) room.building = 'مبنى ' + mm[1];
    }

    setV('fRoom', room.label);
    setV('fBuilding', room.building);
    setV('fCampus', room.campus);
    setV('fRoomType', room.type);
    setV('fCapacity', room.capacity);

    findLecture(key);
    $('btnSend').disabled = false;
  }

  /* ═════════ الماسح ═════════ */

  function stopScanner() {
    if (scanner && scanning) {
      scanner.stop().then(function () {
        scanner.clear();
        $('reader').className = '';
        scanning = false;
        $('btnScan').textContent = 'مسح باركود اللوحة';
      }).catch(function () { scanning = false; });
    }
  }

  function showDiag(scanText, respText) {
    $('diag').style.display = 'block';
    $('diagScan').textContent = scanText || '(فارغ)';
    if (respText !== undefined) $('diagResp').textContent = respText || '(لا يوجد)';
  }

  function onScan(text) {
    stopScanner();
    msg('scanMsg', 'تمت القراءة… جارٍ قراءة صفحة القاعة.', 'info');

    // الباركود يحمل رابط صفحة القاعة -> الـWorker يقرأها ويُرجع بياناتها
    fetchT(ROOMSCAN_URL + '?url=' + encodeURIComponent(text), null, 20000)
      .then(function (r) { return r.text(); })
      .then(function (body) {
        var d = null;
        try { d = JSON.parse(body); } catch (e) { d = null; }

        if (!d || !d.code) {
          msg('scanMsg', 'تعذّر استخراج رمز القاعة من الصفحة. انسخ ما أدناه وأرسله.', 'warn');
          showDiag(text, body.slice(0, 2500));
          return;
        }

        msg('scanMsg', 'تم تحديد القاعة من اللوحة.', 'ok');
        $('diag').style.display = 'none';
        applyRoom({
          code: d.code,
          label: d.code,
          building: d.building || null,
          campus: d.campus || null,
          type: d.roomType || null,
          capacity: d.capacity || null,
          source: 'باركود'
        });
      })
      .catch(function (err) {
        msg('scanMsg', 'تعذّر الاتصال بخدمة القراءة: ' + err.message, 'warn');
        showDiag(text, 'خطأ اتصال');
      });
  }

  function pickCode(body) {
    var data = null;
    try { data = JSON.parse(body); } catch (e) { data = null; }
    var flat = data ? JSON.stringify(data) : body;
    if (data && data.success === false) return { code: null, data: data, flat: flat };
    var c = extractRoomCode((data && (data.room || data.code || data.name || data.roomCode)) || flat);
    return { code: c, data: data, flat: flat };
  }

  function tryWorker(roomId, rawText, i, log) {
    if (i >= PARAM_NAMES.length) {
      msg('scanMsg', 'تعذّر استخراج رمز القاعة. انسخ النصّين أدناه وأرسلهما.', 'warn');
      showDiag(rawText + '   →   المعرّف: ' + (roomId || 'غير موجود'), log.join('\n\n'));
      return;
    }
    var pname = PARAM_NAMES[i];
    var url = ROOMSCAN_URL + '?' + pname + '=' + encodeURIComponent(roomId);
    fetch(url)
      .then(function (r) { return r.text(); })
      .then(function (body) {
        var res = pickCode(body);
        log.push('?' + pname + '= → ' + body.slice(0, 220));
        if (!res.code) { tryWorker(roomId, rawText, i + 1, log); return; }
        msg('scanMsg', 'تم تحديد القاعة (المعامل: ' + pname + ').', 'ok');
        $('diag').style.display = 'none';
        var d = res.data;
        applyRoom({
          code: res.code,
          label: res.code,
          building: d && (d.building || d.buildingName) || null,
          campus: d && (d.campus || d.site) || null,
          type: d && (d.type || d.roomType) || null,
          source: 'باركود'
        });
      })
      .catch(function (err) {
        log.push('?' + pname + '= → خطأ: ' + err.message);
        tryWorker(roomId, rawText, i + 1, log);
      });
  }

  function onScan(text) {
    stopScanner();
    msg('scanMsg', 'تمت القراءة… جارٍ تحديد القاعة.', 'info');

    var code = extractRoomCode(text);
    if (code) {                       // الباركود يحمل الرمز مباشرة
      msg('scanMsg', 'تم تحديد القاعة من الباركود.', 'ok');
      $('diag').style.display = 'none';
      applyRoom({ code: code, label: code, source: 'باركود' });
      return;
    }

    var roomId = extractRoomId(text);
    if (!roomId) {
      msg('scanMsg', 'الباركود لا يحمل رمزاً ولا معرّفاً معروفاً. انسخ نصّه وأرسله.', 'warn');
      showDiag(text, '(لم يُستدعَ الخادم — لا معرّف)');
      return;
    }

    msg('scanMsg', 'المعرّف ' + roomId + ' — جارٍ الاستعلام…', 'info');
    tryWorker(roomId, text, 0, []);
  }

  $('btnScan').addEventListener('click', function () {
    if (scanning) { stopScanner(); return; }
    if (typeof Html5Qrcode === 'undefined') {
      msg('scanMsg', 'لم تُحمَّل مكتبة المسح. تحقق من الاتصال ثم أعد فتح الصفحة.', 'warn');
      return;
    }
    msg('scanMsg', 'جارٍ فتح الكاميرا… اسمح بالإذن عند طلبه.', 'info');
    $('reader').className = 'on';
    scanner = new Html5Qrcode('reader');
    scanner.start(
      { facingMode: 'environment' },
      { fps: 10, qrbox: { width: 230, height: 230 } },
      function (decoded) { onScan(decoded); },
      function () {}
    ).then(function () {
      scanning = true;
      $('btnScan').textContent = 'إيقاف المسح';
      msg('scanMsg', 'وجّه الكاميرا نحو الباركود على لوحة القاعة.', 'info');
    }).catch(function (err) {
      $('reader').className = '';
      msg('scanMsg', 'تعذّر تشغيل الكاميرا: ' + err, 'warn');
    });
  });

  /* ═════════ الملاحظات ═════════ */

  NOTE_OPTIONS.forEach(function (txt, i) {
    var lab = document.createElement('label');
    lab.className = 'chk';
    lab.innerHTML = '<input type="checkbox" value="' + txt + '" data-i="' + i + '"><span>' + txt + '</span>';
    lab.querySelector('input').addEventListener('change', function () {
      lab.className = this.checked ? 'chk sel' : 'chk';
    });
    $('notesBox').appendChild(lab);
  });

  function selectedNotes() {
    var out = [];
    $('notesBox').querySelectorAll('input:checked').forEach(function (c) { out.push(c.value); });
    return out;
  }

  /* ═════════ الإرسال ═════════ */

  $('btnSend').addEventListener('click', function () {
    if (!room) { msg('scanMsg', 'حدِّد القاعة أولاً.', 'warn'); return; }
    var t = refreshClock();
    var btn = $('btnSend');
    btn.disabled = true; btn.textContent = 'جارٍ الإرسال…';

    var payload = {
      // الزمن
      'التاريخ': $('fDate').textContent,
      'اليوم': DAY_NAMES[t.dow],
      'الوقت': $('fTime').textContent,
      'الطابع_الزمني': nowKSA().toISOString(),
      'الفترة': t.period || '',
      // القاعة (من الباركود)
      'رقم_القاعة': room.label || '',
      'رمز_القاعة': room.code || '',
      'المبنى': room.building || '',
      'المقر': room.campus || '',
      'نوع_القاعة': room.type || '',
      'سعة_القاعة': room.capacity || '',
      'مصدر_التحديد': room.source || '',
      'وضع_اختبار': SIM ? 'نعم' : '',
      'إصدار_النموذج': APP_VERSION,
      // المحاضرة (من الجدول)
      'المقرر': lecture ? (lecture.cr || '') : '',
      'كود_المقرر': lecture ? (lecture.cd || '') : '',
      'الشعبة': lecture ? (lecture.sec || '') : '',
      'النشاط': lecture ? (lecture.act || '') : '',
      'المحاضر': lecture ? (lecture.tea || '') : '',
      'القسم': lecture ? (lecture.dep || '') : '',
      'الكلية': lecture ? (lecture.col || '') : '',
      'عدد_الطلبة': lecture ? (lecture.stu || '') : '',
      'فترات_المحاضرة': lecture ? lecture.p.join('، ') : '',
      'حالة_الجدولة': lecture ? 'مجدولة' : 'غير مجدولة',
      'تعارض_جدولة': allMatches.length > 1 ? allMatches.length : '',
      // الرصد
      'الملاحظات': selectedNotes().join(' | '),
      'ملاحظات_حرة': $('freeNote').value.trim()
    };

    fetchT(SUBMIT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    })
      .then(function (r) { return r.text().then(function (tx) { return { ok: r.ok, tx: tx }; }); })
      .then(function (res) {
        if (!res.ok) throw new Error(res.tx || 'فشل الإرسال');
        msg('scanMsg', 'تم تسجيل الرصد بنجاح.', 'ok');
        btn.textContent = 'تم الإرسال ✓';
        window.scrollTo({ top: 0, behavior: 'smooth' });
        setTimeout(function () { location.reload(); }, 2200);
      })
      .catch(function (err) {
        msg('scanMsg', 'تعذّر الإرسال: ' + err.message + ' — أعد المحاولة.', 'warn');
        btn.disabled = false; btn.textContent = 'إرسال';
      });
  });

  /* ═════════ الإقلاع ═════════ */

  if (SIM) {
    var bn = document.createElement('div');
    bn.style.cssText = 'background:#B87B02;color:#fff;padding:9px 14px;text-align:center;font-size:13px;font-weight:700';
    bn.textContent = 'وضع اختبار — الزمن محاكى: ' + SIM.toLocaleString('ar-SA');
    document.body.insertBefore(bn, document.body.firstChild);
    $('btnSend').textContent = 'إرسال (وضع اختبار)';
  }

  $('verTag').textContent = 'إصدار ' + APP_VERSION;

  refreshClock();
  setInterval(function () {
    refreshClock();
    if (room) findLecture(room.key);   // تحديث المحاضرة مع تغيّر الفترة
  }, 60000);

  loadSchedule().then(function (j) {
    msg('scanMsg', 'جاهز (' + APP_VERSION + ') — ' + (j.term || 'الجدول') + ' · ' + Object.keys(j.index).length + ' قاعة.', 'ok');
  }).catch(function (e) {
    msg('scanMsg', 'تعذّر تحميل الجدول الدراسي (' + e.message + '). سيعمل النموذج دون بيانات المحاضرة.', 'warn');
  });

});
</script>
</body>
</html>
